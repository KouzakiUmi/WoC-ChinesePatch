name: Build and publish standalone release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check PyInstaller==6.19.0

      - name: Build one-file GUI executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name WoC-ChinesePatch
          --add-data "manifest.json;."
          --add-data "payload;payload"
          --distpath dist --workpath build tools/patch_launcher.py

      - name: Create release and upload executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME dist/WoC-ChinesePatch.exe
          --repo KouzakiUmi/WoC-ChinesePatch
          --title "WoC 中文补丁 $env:GITHUB_REF_NAME (PC)"
          --generate-notes --verify-tag
